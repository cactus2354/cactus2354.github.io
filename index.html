<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>John | Photography</title>
  <meta name="description" content="A collection of photographs.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#gallery">Skip to gallery</a>

  <header class="site-header">
    <p class="wordmark">JOHN</p>
  </header>

  <main>
    <section id="gallery" class="gallery" aria-label="Photo gallery">
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> John. All rights reserved.</p>
    <p class="footer-links">
      <a href="mailto:houseki@airmail.cc">email</a>
      <a href="license.html">license</a>
    </p>
  </footer>

  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lightbox-close" type="button" aria-label="Close">&times;</button>
    <button class="lightbox-prev" type="button" aria-label="Previous photo">&larr;</button>
    <button class="lightbox-next" type="button" aria-label="Next photo">&rarr;</button>
    <figure class="lightbox-figure">
      <img class="lightbox-image" src="" alt="">
      <figcaption class="lightbox-caption"></figcaption>
    </figure>
    <p class="lightbox-counter" aria-hidden="true"></p>
  </div>

  <script src="js/gallery.js"></script>
</body>
</html>
